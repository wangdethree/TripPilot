[project]
name = "trippilot"
version = "0.1.0"
description = "A controllable and testable travel-planning agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.140,<0.141",
  "httpx>=0.28,<1",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "openai>=2.50,<3",
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-instrumentation-fastapi>=0.65b0,<1",
  "opentelemetry-sdk>=1.44,<2",
  "psycopg[binary,pool]>=3.3,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "sqlalchemy>=2.0,<3",
  "structlog>=25.5,<26",
  "uvicorn>=0.51,<1",
]

[project.scripts]
trippilot-eval = "trippilot.evaluation.runner:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "hypothesis>=6.163,<7",
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16,<0.17",
]

[tool.uv]
required-version = "==0.11.32"
package = true
environments = [
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "E",
  "F",
  "I",
  "RUF",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=trippilot",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=85",
]
asyncio_mode = "strict"

[tool.coverage.run]
branch = true
source = ["trippilot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
